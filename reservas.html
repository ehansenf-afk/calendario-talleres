<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario de Reservas — Casa Turquesa (Interno)</title>
<style>
  :root {
    --bg: #f4f1ea;
    --paper: #ffffff;
    --ink: #211c17;
    --ink-soft: #6b6156;
    --line: #e2dbcd;
    --teal: #0e6b62;
    --teal-soft: #d9ece9;
    --gold: #a97327;
    --gold-soft: #f3e3cc;
    --crit-soft: #f7dcd9;
    --crit: #a3312a;
    --shadow: 0 1px 2px rgba(33,28,23,0.06), 0 8px 24px rgba(33,28,23,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16211f; --paper: #1c2926; --ink: #eee7db; --ink-soft: #a99f8f;
      --line: #33423e; --teal: #5fc9bb; --teal-soft: #24403b;
      --gold: #e0ab5c; --gold-soft: #3a3324;
      --crit-soft: #3d2422; --crit: #e2837c;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; display: flex; flex-direction: column; gap: 28px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
  .eyebrow { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin: 0 0 6px; }
  h1 { font-size: clamp(24px, 4vw, 34px); margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: -0.01em; }
  .badge-interno { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: var(--gold-soft); color: var(--gold); padding: 3px 10px; border-radius: 999px; }

  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 22px 24px; }
  .panel h2 { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 600; margin: 0 0 16px; }

  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; font-family: ui-sans-serif, system-ui, sans-serif; }
  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
  .form-grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 5px; }
  input, select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); font-size: 14px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  textarea { resize: vertical; min-height: 50px; }
  .hint { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }
  .btn-primario {
    background: var(--gold); color: #fff; border: none; border-radius: 6px; padding: 11px 22px;
    font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .btn-primario:disabled { opacity: 0.55; cursor: default; }
  .msg { font-size: 13px; font-family: ui-sans-serif, system-ui, sans-serif; margin-top: 12px; padding: 10px 12px; border-radius: 6px; display: none; }
  .msg.ok { display: block; background: var(--teal-soft); color: var(--teal); }
  .msg.error { display: block; background: var(--crit-soft); color: var(--crit); }
  .slot-warning { font-size: 12px; color: var(--crit); margin-top: 4px; display: none; font-family: ui-sans-serif, system-ui, sans-serif; }
  .slot-warning.show { display: block; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .toolbar input[type="search"] { flex: 1; min-width: 180px; }

  .months { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  @media (max-width: 720px) { .months { grid-template-columns: 1fr; } }
  .month-card { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; }
  .month-head { padding: 16px 20px 12px; display: flex; align-items: baseline; justify-content: space-between; }
  .month-head h2 { font-size: 18px; margin: 0; font-weight: 600; text-transform: capitalize; }
  .month-head span { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
  table.cal { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .cal th { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; padding: 6px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .cal td { height: 66px; vertical-align: top; padding: 5px 6px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); font-size: 13px; font-variant-numeric: tabular-nums; position: relative; }
  .cal td:last-child { border-right: none; }
  .cal td.pad { background: transparent; color: transparent; border-color: transparent; }
  .daynum { color: var(--ink-soft); font-size: 11.5px; }
  .cal td.today .daynum { display: inline-block; background: var(--gold); color: var(--paper); width: 18px; height: 18px; line-height: 18px; text-align: center; border-radius: 50%; font-weight: 600; }
  .dot-row { margin-top: 3px; display: flex; flex-direction: column; gap: 2px; }
  .dot { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; line-height: 1.25; background: var(--gold-soft); color: var(--gold); padding: 1.5px 5px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; border: none; text-align: left; display: block; width: 100%; font-weight: 600; }
  .dot:hover { filter: brightness(0.95); }
  .dot.taller { background: var(--teal-soft); color: var(--teal); }
  .dot.cancelada { background: var(--line); color: var(--ink-soft); text-decoration: line-through; }

  .list { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); padding: 4px 0; }
  .list h2 { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; margin: 0; padding: 18px 22px 10px; }
  .item { display: grid; grid-template-columns: 84px 1fr auto; gap: 18px; align-items: start; padding: 16px 22px; border-top: 1px solid var(--line); scroll-margin-top: 20px; }
  .item:target, .item.flash { background: var(--gold-soft); }
  .item.cancelada { opacity: 0.5; }
  .item .when { font-family: ui-sans-serif, system-ui, sans-serif; }
  .item .when .dow { font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
  .item.taller .when .dow { color: var(--teal); }
  .item .when .dnum { font-size: 26px; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .item .when .mon { font-size: 11px; color: var(--ink-soft); text-transform: capitalize; }
  .item .body h3 { margin: 0 0 4px; font-size: 16.5px; font-weight: 600; text-wrap: balance; }
  .item .meta { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12.5px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 6px; }
  .item .desc { font-size: 13px; color: var(--ink-soft); line-height: 1.5; max-width: 62ch; }
  .item .side { text-align: right; font-family: ui-sans-serif, system-ui, sans-serif; white-space: nowrap; }
  .personas { font-size: 15px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
  .item.taller .personas, .tag-taller { color: var(--teal); }
  .codigo { font-family: ui-monospace, monospace; font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
  .tag { display: inline-block; margin-top: 6px; font-size: 10.5px; padding: 2px 7px; border-radius: 3px; font-weight: 600; }
  .tag-reserva { background: var(--gold-soft); color: var(--gold); }
  .tag-taller { background: var(--teal-soft); }
  .contact { margin-top: 8px; font-size: 11.5px; color: var(--ink-soft); }
  .contact a { color: var(--teal); text-decoration: none; }
  .contact a:hover { text-decoration: underline; }
  .estado-cancelada { display: inline-block; margin-top: 6px; font-size: 10.5px; background: var(--crit-soft); color: var(--crit); padding: 2px 7px; border-radius: 3px; font-weight: 600; }
  footer { text-align: center; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; color: var(--ink-soft); padding-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Casa Turquesa · Uso interno</p>
      <h1>Calendario de reservas y talleres</h1>
    </div>
    <span class="badge-interno">Solo equipo</span>
  </header>

  <div class="panel">
    <h2>➕ Nueva reserva</h2>
    <form id="formReserva" class="form-grid">
      <div>
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" required>
      </div>
      <div>
        <label for="hora">Hora</label>
        <select id="hora" required></select>
        <p class="slot-warning" id="slotWarning">Ese horario ya está ocupado — revisa el calendario antes de confirmar.</p>
      </div>
      <div>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" required>
      </div>
      <div>
        <label for="rut">RUT</label>
        <input type="text" id="rut" placeholder="12.345.678-9" required>
      </div>
      <div>
        <label for="whatsapp">WhatsApp</label>
        <input type="tel" id="whatsapp" placeholder="+56 9 1234 5678" required>
      </div>
      <div>
        <label for="correo">Correo</label>
        <input type="email" id="correo" required>
      </div>
      <div>
        <label for="personas">N° de personas</label>
        <input type="number" id="personas" min="1" required>
      </div>
      <div>
        <label for="plataforma">Coordinado por</label>
        <input type="text" id="plataforma" placeholder="Ej: Mauricio, teléfono" required>
      </div>
      <div class="full">
        <label for="nota">Descripción del taller (opcional)</label>
        <textarea id="nota" placeholder="Detalles adicionales..."></textarea>
      </div>
      <div class="full">
        <button type="submit" class="btn-primario" id="btnGuardar">Guardar reserva</button>
        <div class="msg" id="msgResultado"></div>
      </div>
    </form>
  </div>

  <div class="toolbar">
    <input type="search" id="buscar" placeholder="Buscar por nombre, código o teléfono...">
    <select id="filtroEstado">
      <option value="activa">Solo activas</option>
      <option value="todas">Todas (incluye canceladas)</option>
    </select>
  </div>

  <div class="months" id="months"></div>

  <div class="list">
    <h2>Detalle por fecha</h2>
    <div id="listItems"></div>
  </div>

  <footer id="footerNote">Cargando desde Supabase…</footer>
</div>

<script>
const SUPABASE_URL = "https://udsvumfwczyormmprizm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkc3Z1bWZ3Y3p5b3JtbXByaXptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTg1MzgsImV4cCI6MjA5NTM5NDUzOH0.h3MzXhUrIkwssCCwWSohg9l40weroZUP81NJ3PLIAxE";
const NEGOCIO_ID = "5735c7c1-6158-4c9d-856c-2f465e65321e";

const DOW = ["Lun","Mar","Mié","Jué","Vie","Sáb","Dom"];
function mondayIndex(nativeDay) { return (nativeDay + 6) % 7; }
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

function parseISO(s) {
  const [y,m,d] = s.split("-").map(Number);
  return new Date(Date.UTC(y, m-1, d));
}
function hhmm(t) { return t ? t.slice(0,5) : ""; }

let TODOS = [];

function generarCodigo() {
  const letras = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  let c = "";
  for (let i = 0; i < 6; i++) c += letras[Math.floor(Math.random() * letras.length)];
  return "Coffee-" + c;
}

function esFinDeSemana(fechaISO) {
  const d = parseISO(fechaISO);
  const dow = d.getUTCDay();
  return dow === 0 || dow === 6;
}

function poblarHoras(fechaISO) {
  const select = document.getElementById("hora");
  select.innerHTML = "";
  if (!fechaISO) return;
  const finde = esFinDeSemana(fechaISO);
  const inicioMin = finde ? 9 * 60 : 7 * 60 + 30;
  const finMin = 21 * 60;
  for (let m = inicioMin; m <= finMin; m += 30) {
    const h = Math.floor(m / 60), mn = m % 60;
    const val = String(h).padStart(2, "0") + ":" + String(mn).padStart(2, "0");
    const opt = document.createElement("option");
    opt.value = val;
    opt.textContent = val + " hrs";
    select.appendChild(opt);
  }
}

async function cargarTodo() {
  const [resR, resT] = await Promise.all([
    fetch(SUPABASE_URL + "/rest/v1/reservas?select=*&order=fecha,hora", { headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY } }),
    fetch(SUPABASE_URL + "/rest/v1/talleres?estado=eq.activo&select=*&order=fecha,hora", { headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY } })
  ]);
  if (!resR.ok) throw new Error("Supabase (reservas) respondió " + resR.status);
  if (!resT.ok) throw new Error("Supabase (talleres) respondió " + resT.status);
  const reservas = (await resR.json()).map(r => ({
    tipo: "reserva",
    id: "r-" + r.id,
    idReserva: r.id_reserva || "",
    fecha: r.fecha,
    hora: hhmm(r.hora),
    nombre: r.nombre_contacto || "Sin nombre",
    personas: r.personas,
    whatsapp: r.whatsapp_contacto || "",
    correo: r.correo || "",
    rut: r.rut || "",
    nota: r.nota || "",
    plataforma: r.plataforma || "",
    estado: (r.estado || "").toLowerCase()
  }));
  const talleres = (await resT.json()).map(t => ({
    tipo: "taller",
    id: "t-" + t.id,
    fecha: t.fecha,
    hora: hhmm(t.hora),
    nombre: t.titulo,
    tallerista: t.tallerista || "",
    whatsapp: t.contacto_whatsapp || "",
    estado: "activa"
  }));
  return reservas.concat(talleres);
}

function render() {
  const q = document.getElementById("buscar").value.toLowerCase();
  const soloActivas = document.getElementById("filtroEstado").value === "activa";

  let items = TODOS.filter(r => {
    if (soloActivas && r.estado === "cancelada") return false;
    if (!q) return true;
    return r.nombre.toLowerCase().includes(q) || (r.idReserva || "").toLowerCase().includes(q) || (r.whatsapp || "").includes(q);
  });

  const hoyDate = new Date();
  const HOY = hoyDate.toISOString().slice(0,10);

  const porFecha = {};
  items.forEach(r => { (porFecha[r.fecha] = porFecha[r.fecha] || []).push(r); });

  document.getElementById("footerNote").innerHTML = 'Datos en vivo desde Supabase · tablas <code>reservas</code> y <code>talleres</code> · actualizado ' + hoyDate.toLocaleString("es-CL", { dateStyle: "medium", timeStyle: "short" });

  let startYear = hoyDate.getUTCFullYear();
  let startMonth = hoyDate.getUTCMonth();
  let endYear = startYear, endMonth = startMonth + 1;
  if (endMonth > 11) { endMonth = 0; endYear++; }
  items.forEach(r => {
    const d = parseISO(r.fecha);
    const y = d.getUTCFullYear(), m = d.getUTCMonth();
    if (y > endYear || (y === endYear && m > endMonth)) { endYear = y; endMonth = m; }
  });

  const monthsWrap = document.getElementById("months");
  monthsWrap.innerHTML = "";
  let y = startYear, m = startMonth;
  while (y < endYear || (y === endYear && m <= endMonth)) {
    monthsWrap.appendChild(buildMonth(y, m, porFecha, HOY));
    m++; if (m > 11) { m = 0; y++; }
  }

  const listWrap = document.getElementById("listItems");
  listWrap.innerHTML = "";
  if (items.length === 0) {
    listWrap.innerHTML = '<div class="item" style="grid-template-columns:1fr;color:var(--ink-soft);font-family:ui-sans-serif,system-ui,sans-serif;">No hay nada para este filtro.</div>';
    return;
  }
  items.slice().sort((a,b) => a.fecha.localeCompare(b.fecha) || a.hora.localeCompare(b.hora)).forEach(r => {
    const d = parseISO(r.fecha);
    const cancelada = r.estado === "cancelada";
    const esTaller = r.tipo === "taller";
    const item = document.createElement("div");
    item.className = "item" + (cancelada ? " cancelada" : "") + (esTaller ? " taller" : "");
    item.id = r.id;
    if (esTaller) {
      item.innerHTML = `
        <div class="when">
          <div class="dow">${DOW[mondayIndex(d.getUTCDay())]}</div>
          <div class="dnum">${d.getUTCDate()}</div>
          <div class="mon">${MESES[d.getUTCMonth()]}</div>
        </div>
        <div class="body">
          <h3>${r.nombre}</h3>
          <div class="meta"><span>🕐 ${r.hora} hrs</span><span>🎨 ${r.tallerista}</span></div>
        </div>
        <div class="side"><div class="tag tag-taller">Taller</div></div>
      `;
    } else {
      item.innerHTML = `
        <div class="when">
          <div class="dow">${DOW[mondayIndex(d.getUTCDay())]}</div>
          <div class="dnum">${d.getUTCDate()}</div>
          <div class="mon">${MESES[d.getUTCMonth()]}</div>
        </div>
        <div class="body">
          <h3>${r.nombre}</h3>
          <div class="meta">
            <span>🕐 ${r.hora} hrs</span>
            <span>👥 ${r.personas || "?"} personas</span>
            ${r.rut ? `<span>🪪 ${r.rut}</span>` : ""}
          </div>
          ${r.nota ? `<p class="desc">📝 ${r.nota}</p>` : ""}
          <p class="contact">☎️ <a href="https://wa.me/${(r.whatsapp||"").replace(/\D/g,"")}" target="_blank" rel="noopener">${r.whatsapp || "sin teléfono"}</a> ${r.correo ? "· " + r.correo : ""}</p>
        </div>
        <div class="side">
          <div class="personas">${r.personas || "?"} pax</div>
          ${r.idReserva ? `<div class="codigo">${r.idReserva}</div>` : ""}
          ${r.plataforma ? `<div class="tag tag-reserva">${r.plataforma}</div>` : ""}
          ${cancelada ? '<div class="estado-cancelada">Cancelada</div>' : ""}
        </div>
      `;
    }
    listWrap.appendChild(item);
  });
}

function buildMonth(year, monthIdx, porFecha, HOY) {
  const first = new Date(Date.UTC(year, monthIdx, 1));
  const startDow = mondayIndex(first.getUTCDay());
  const daysInMonth = new Date(Date.UTC(year, monthIdx+1, 0)).getUTCDate();

  const card = document.createElement("div");
  card.className = "month-card";
  const head = document.createElement("div");
  head.className = "month-head";
  head.innerHTML = `<h2>${MESES[monthIdx]} ${year}</h2><span>${daysInMonth} días</span>`;
  card.appendChild(head);

  const table = document.createElement("table");
  table.className = "cal";
  const thead = document.createElement("tr");
  DOW.forEach(d => { const th = document.createElement("th"); th.textContent = d; thead.appendChild(th); });
  table.appendChild(thead);

  let cellsUsed = startDow;
  let row = document.createElement("tr");
  for (let i = 0; i < startDow; i++) { const td = document.createElement("td"); td.className = "pad"; row.appendChild(td); }

  for (let day = 1; day <= daysInMonth; day++) {
    if (cellsUsed === 7) { table.appendChild(row); row = document.createElement("tr"); cellsUsed = 0; }
    const iso = `${year}-${String(monthIdx+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const td = document.createElement("td");
    if (iso === HOY) td.className = "today";
    const num = document.createElement("span");
    num.className = "daynum";
    num.textContent = day;
    td.appendChild(num);
    const dias = porFecha[iso];
    if (dias) {
      const wrap = document.createElement("div");
      wrap.className = "dot-row";
      dias.forEach(r => {
        const btn = document.createElement("button");
        btn.className = "dot" + (r.tipo === "taller" ? " taller" : "") + (r.estado === "cancelada" ? " cancelada" : "");
        btn.textContent = (r.tipo === "taller" ? "🎨 " : "") + r.nombre;
        btn.title = r.nombre + " — " + r.hora + " hrs";
        btn.onclick = () => jumpTo(r.id);
        wrap.appendChild(btn);
      });
      td.appendChild(wrap);
    }
    row.appendChild(td);
    cellsUsed++;
  }
  while (cellsUsed < 7) { const td = document.createElement("td"); td.className = "pad"; row.appendChild(td); cellsUsed++; }
  table.appendChild(row);

  card.appendChild(table);
  return card;
}

function jumpTo(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({behavior:"smooth", block:"center"});
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1600);
}

document.getElementById("buscar").addEventListener("input", render);
document.getElementById("filtroEstado").addEventListener("change", render);

document.getElementById("fecha").addEventListener("change", (e) => {
  poblarHoras(e.target.value);
  chequearOcupado();
});
document.getElementById("hora").addEventListener("change", chequearOcupado);

function chequearOcupado() {
  const fecha = document.getElementById("fecha").value;
  const hora = document.getElementById("hora").value;
  const warning = document.getElementById("slotWarning");
  if (!fecha || !hora) { warning.classList.remove("show"); return; }
  const ocupado = TODOS.some(r => r.fecha === fecha && r.hora === hora && r.estado !== "cancelada");
  warning.classList.toggle("show", ocupado);
}

const hoyInput = document.getElementById("fecha");
hoyInput.min = new Date().toISOString().slice(0,10);

document.getElementById("formReserva").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btnGuardar");
  const msg = document.getElementById("msgResultado");
  msg.className = "msg";
  btn.disabled = true;
  btn.textContent = "Guardando...";

  const payload = {
    negocio_id: NEGOCIO_ID,
    id_reserva: generarCodigo(),
    fecha: document.getElementById("fecha").value,
    hora: document.getElementById("hora").value + ":00",
    nombre_contacto: document.getElementById("nombre").value.trim(),
    rut: document.getElementById("rut").value.trim(),
    whatsapp_contacto: document.getElementById("whatsapp").value.trim(),
    correo: document.getElementById("correo").value.trim().toLowerCase(),
    personas: parseInt(document.getElementById("personas").value, 10),
    plataforma: document.getElementById("plataforma").value.trim(),
    nota: document.getElementById("nota").value.trim() || null,
    estado: "activa"
  };

  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/reservas", {
      method: "POST",
      headers: {
        apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json", Prefer: "return=minimal"
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("Error " + res.status);

    msg.classList.add("ok");
    msg.textContent = "✅ Reserva guardada con código " + payload.id_reserva;
    document.getElementById("formReserva").reset();
    document.getElementById("hora").innerHTML = "";
    document.getElementById("slotWarning").classList.remove("show");

    TODOS = await cargarTodo();
    render();
  } catch (err) {
    msg.classList.add("error");
    msg.textContent = "❌ No se pudo guardar. Intenta de nuevo.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Guardar reserva";
  }
});

cargarTodo()
  .then(rows => { TODOS = rows; render(); })
  .catch(err => {
    document.getElementById("footerNote").textContent = "Error al cargar desde Supabase: " + err.message;
  });
</script>
</body>
</html>
