<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario de Talleres — Casa Turquesa</title>
<style>
  :root {
    --bg: #f4f1ea;
    --paper: #ffffff;
    --ink: #211c17;
    --ink-soft: #6b6156;
    --line: #e2dbcd;
    --teal: #0e6b62;
    --teal-soft: #d9ece9;
    --gold: #a97327;
    --gold-soft: #f3e3cc;
    --shadow: 0 1px 2px rgba(33,28,23,0.06), 0 8px 24px rgba(33,28,23,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16211f;
      --paper: #1c2926;
      --ink: #eee7db;
      --ink-soft: #a99f8f;
      --line: #33423e;
      --teal: #5fc9bb;
      --teal-soft: #24403b;
      --gold: #e0ab5c;
      --gold-soft: #3a3324;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; display: flex; flex-direction: column; gap: 28px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
  .eyebrow { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--teal); margin: 0 0 6px; }
  h1 { font-size: clamp(28px, 4vw, 38px); margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: -0.01em; }
  .count { font-family: ui-sans-serif, system-ui, sans-serif; color: var(--ink-soft); font-size: 14px; }
  .count b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .months { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  @media (max-width: 720px) { .months { grid-template-columns: 1fr; } }
  .month-card { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; }
  .month-head { padding: 16px 20px 12px; display: flex; align-items: baseline; justify-content: space-between; }
  .month-head h2 { font-size: 18px; margin: 0; font-weight: 600; text-transform: capitalize; }
  .month-head span { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
  table.cal { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .cal th { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; padding: 6px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .cal td { height: 62px; vertical-align: top; padding: 5px 6px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); font-size: 13px; font-variant-numeric: tabular-nums; position: relative; }
  .cal td:last-child { border-right: none; }
  .cal td.pad { background: transparent; color: transparent; border-color: transparent; }
  .daynum { color: var(--ink-soft); font-size: 11.5px; }
  .cal td.today .daynum { display: inline-block; background: var(--teal); color: var(--paper); width: 18px; height: 18px; line-height: 18px; text-align: center; border-radius: 50%; font-weight: 600; }
  .dot-row { margin-top: 3px; display: flex; flex-direction: column; gap: 2px; }
  .dot { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; line-height: 1.25; background: var(--teal-soft); color: var(--teal); padding: 1.5px 5px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; border: none; text-align: left; display: block; width: 100%; font-weight: 600; }
  .dot:hover { filter: brightness(0.95); }
  .dot.reserva { background: var(--gold-soft); color: var(--gold); }
  .list { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); padding: 4px 0; }
  .list h2 { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; margin: 0; padding: 18px 22px 10px; }
  .item { display: grid; grid-template-columns: 84px 1fr auto; gap: 18px; align-items: start; padding: 16px 22px; border-top: 1px solid var(--line); scroll-margin-top: 20px; }
  .item:target, .item.flash { background: var(--teal-soft); }
  .item .when { font-family: ui-sans-serif, system-ui, sans-serif; }
  .item .when .dow { font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--teal); font-weight: 700; }
  .item .when .dnum { font-size: 26px; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .item .when .mon { font-size: 11px; color: var(--ink-soft); text-transform: capitalize; }
  .item .body h3 { margin: 0 0 4px; font-size: 16.5px; font-weight: 600; text-wrap: balance; }
  .item .meta { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12.5px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 6px; }
  .item .desc { font-size: 13px; color: var(--ink-soft); line-height: 1.5; max-width: 62ch; }
  .item .side { text-align: right; font-family: ui-sans-serif, system-ui, sans-serif; white-space: nowrap; }
  .price { font-size: 15px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
  .price.tbd { color: var(--ink-soft); font-weight: 500; font-size: 12px; }
  .cb { display: inline-block; margin-top: 6px; font-size: 10.5px; background: var(--gold-soft); color: var(--gold); padding: 2px 7px; border-radius: 3px; font-weight: 600; }
  .contact { margin-top: 8px; font-size: 11.5px; color: var(--ink-soft); }
  .contact a { color: var(--teal); text-decoration: none; }
  .contact a:hover { text-decoration: underline; }
  footer { text-align: center; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; color: var(--ink-soft); padding-top: 8px; }
  a.focus-visible, button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .searchbar { position: relative; }
  .searchbar input {
    width: 100%; max-width: 340px; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px;
    padding: 9px 14px 9px 34px; border: 1px solid var(--line); border-radius: 20px; background: var(--paper);
    color: var(--ink); outline: none; transition: border-color 0.15s;
  }
  .searchbar input:focus { border-color: var(--teal); }
  .searchbar svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--ink-soft); pointer-events: none; }
  .searchbar .clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 15px; padding: 2px 6px; display: none; }
  .searchbar.has-text .clear { display: block; }

  .dot.hidden-match { opacity: 0.22; filter: grayscale(0.6); }
  .item.hidden-match { display: none; }
  .no-results { padding: 22px; text-align: center; color: var(--ink-soft); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; }

  .tt {
    position: fixed; z-index: 50; max-width: 240px; background: var(--ink); color: var(--paper);
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; line-height: 1.45; padding: 10px 12px;
    border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.25); pointer-events: none; opacity: 0; transform: translateY(4px);
    transition: opacity 0.12s, transform 0.12s;
  }
  .tt.show { opacity: 1; transform: translateY(0); }
  .tt .tt-title { font-weight: 700; margin-bottom: 3px; font-family: "Iowan Old Style", Georgia, serif; font-size: 13px; }
  .tt .tt-meta { opacity: 0.75; font-size: 11px; margin-bottom: 4px; }
  .tt .tt-desc { opacity: 0.92; }
  @media (prefers-color-scheme: dark) { .tt { background: #eee7db; color: #16211f; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Casa Turquesa · Ñuñoa</p>
      <h1>Calendario de talleres</h1>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
      <p class="count"><b id="countNum">0</b> talleres activos</p>
      <div class="searchbar" id="searchbar">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="buscador" placeholder="Buscar taller o tallerista…" autocomplete="off">
        <button class="clear" id="clearBtn" aria-label="Limpiar búsqueda">✕</button>
      </div>
    </div>
  </header>

  <div class="months" id="months"></div>

  <div class="list">
    <h2>Detalle por fecha</h2>
    <div id="listItems"></div>
  </div>

  <footer id="footerNote">Cargando desde Supabase…</footer>
</div>
<div class="tt" id="tooltip"></div>

<script>
const SUPABASE_URL = "https://udsvumfwczyormmprizm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkc3Z1bWZ3Y3p5b3JtbXByaXptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTg1MzgsImV4cCI6MjA5NTM5NDUzOH0.h3MzXhUrIkwssCCwWSohg9l40weroZUP81NJ3PLIAxE";

const DOW = ["Lun","Mar","Mié","Jué","Vie","Sáb","Dom"];
function mondayIndex(nativeDay) { return (nativeDay + 6) % 7; }
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

function parseISO(s) {
  const [y,m,d] = s.split("-").map(Number);
  return new Date(Date.UTC(y, m-1, d));
}
function money(n) { return "$" + n.toLocaleString("es-CL"); }
function hhmm(t) { return t ? t.slice(0,5) : ""; }

function horaMasHoras(hhmmStr, horas) {
  if (!hhmmStr) return "";
  const [h, mnt] = hhmmStr.split(":").map(Number);
  const total = (h * 60 + mnt + horas * 60) % (24 * 60);
  const h2 = Math.floor(total / 60), m2 = total % 60;
  return String(h2).padStart(2,"0") + ":" + String(m2).padStart(2,"0");
}

async function cargarTalleres() {
  const url = SUPABASE_URL + "/rest/v1/talleres?estado=eq.activo&select=*&order=fecha,hora";
  const res = await fetch(url, { headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY } });
  if (!res.ok) throw new Error("Supabase respondió " + res.status);
  const rows = await res.json();
  return rows.map(r => ({
    tipo: "taller",
    id: r.id,
    titulo: r.titulo,
    fecha: r.fecha,
    hora: hhmm(r.hora),
    precio: r.precio,
    tallerista: r.tallerista || "",
    coffee_break: r.coffee_break || null,
    whatsapp: r.contacto_whatsapp || "",
    instagram: r.contacto_instagram || "",
    desc: r.descripcion || ""
  }));
}

function render(talleres) {
  const hoyDate = new Date();
  const HOY = hoyDate.toISOString().slice(0,10);

  const porFecha = {};
  talleres.forEach(t => { (porFecha[t.fecha] = porFecha[t.fecha] || []).push(t); });

  document.getElementById("countNum").textContent = talleres.length;
  document.getElementById("footerNote").innerHTML = 'Datos en vivo desde Supabase · tabla <code>talleres</code>, estado activo · actualizado ' + hoyDate.toLocaleString("es-CL", { dateStyle: "medium", timeStyle: "short" });

  let startYear = hoyDate.getUTCFullYear();
  let startMonth = hoyDate.getUTCMonth();
  let endYear = startYear, endMonth = startMonth + 1;
  if (endMonth > 11) { endMonth = 0; endYear++; }
  talleres.forEach(t => {
    const d = parseISO(t.fecha);
    const y = d.getUTCFullYear(), m = d.getUTCMonth();
    if (y > endYear || (y === endYear && m > endMonth)) { endYear = y; endMonth = m; }
  });

  const monthsWrap = document.getElementById("months");
  monthsWrap.innerHTML = "";
  let y = startYear, m = startMonth;
  while (y < endYear || (y === endYear && m <= endMonth)) {
    monthsWrap.appendChild(buildMonth(y, m, porFecha, HOY));
    m++; if (m > 11) { m = 0; y++; }
  }

  const listWrap = document.getElementById("listItems");
  listWrap.innerHTML = "";
  if (talleres.length === 0) {
    listWrap.innerHTML = '<div class="item" style="grid-template-columns:1fr;color:var(--ink-soft);font-family:ui-sans-serif,system-ui,sans-serif;">No hay talleres activos por ahora.</div>';
    return;
  }
  talleres.slice().sort((a,b) => a.fecha.localeCompare(b.fecha)).forEach(t => {
    const d = parseISO(t.fecha);
    const item = document.createElement("div");
    item.className = "item";
    item.id = "t-" + t.id;
    item.dataset.titulo = t.titulo;
    item.dataset.tallerista = t.tallerista;
    item.innerHTML = `
      <div class="when">
        <div class="dow">${DOW[mondayIndex(d.getUTCDay())]}</div>
        <div class="dnum">${d.getUTCDate()}</div>
        <div class="mon">${MESES[d.getUTCMonth()]}</div>
      </div>
      <div class="body">
        <h3>${t.titulo}</h3>
        <div class="meta">
          <span>🕐 ${t.hora} hrs</span>
          <span>🎨 ${t.tallerista}</span>
        </div>
        <p class="desc">${t.desc}</p>
        <p class="contact">☎️ <a href="https://wa.me/${t.whatsapp.replace(/\D/g,"")}" target="_blank" rel="noopener">${t.whatsapp}</a> ${t.instagram ? "· " + t.instagram : ""}</p>
      </div>
      <div class="side">
        ${t.precio == null ? '<div class="price tbd">Precio por confirmar</div>' : `<div class="price">${money(t.precio)}</div>`}
        ${t.coffee_break ? `<div class="cb">☕ ${t.coffee_break.split(":")[0]}</div>` : ""}
      </div>
    `;
    listWrap.appendChild(item);
  });
}

let TODOS_TALLERES = [];

cargarTalleres()
  .then(talleres => { TODOS_TALLERES = talleres; render(talleres); })
  .catch(err => {
    document.getElementById("footerNote").textContent = "Error al cargar desde Supabase: " + err.message;
  });

function normaliza(s) {
  return (s || "").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}

function aplicarBusqueda() {
  const q = normaliza(document.getElementById("buscador").value.trim());
  document.getElementById("searchbar").classList.toggle("has-text", q.length > 0);

  let visibles = 0;
  document.querySelectorAll(".dot").forEach(btn => {
    const match = !q || normaliza(btn.dataset.titulo).includes(q) || normaliza(btn.dataset.tallerista).includes(q);
    btn.classList.toggle("hidden-match", !match);
  });

  document.querySelectorAll(".item").forEach(item => {
    const match = !q || normaliza(item.dataset.titulo).includes(q) || normaliza(item.dataset.tallerista).includes(q);
    item.classList.toggle("hidden-match", !match);
    if (match) visibles++;
  });

  let noRes = document.getElementById("noResultsMsg");
  if (visibles === 0 && q) {
    if (!noRes) {
      noRes = document.createElement("div");
      noRes.id = "noResultsMsg";
      noRes.className = "no-results";
      document.getElementById("listItems").appendChild(noRes);
    }
    noRes.textContent = `No encontramos talleres que coincidan con "${document.getElementById("buscador").value.trim()}".`;
  } else if (noRes) {
    noRes.remove();
  }
}

document.getElementById("buscador").addEventListener("input", aplicarBusqueda);
document.getElementById("clearBtn").addEventListener("click", () => {
  document.getElementById("buscador").value = "";
  aplicarBusqueda();
  document.getElementById("buscador").focus();
});

const tooltip = document.getElementById("tooltip");
function mostrarTooltip(e, t) {
  const partes = [];
  partes.push(`🕐 ${t.hora} hrs`);
  if (t.tallerista) partes.push(`🎨 ${t.tallerista}`);
  tooltip.innerHTML = `
    <div class="tt-title">${t.titulo}</div>
    <div class="tt-meta">${partes.join(" · ")}${t.precio == null ? " · Precio por confirmar" : " · " + money(t.precio)}</div>
    ${t.desc ? `<div class="tt-desc">${t.desc}</div>` : ""}
  `;
  tooltip.classList.add("show");
  posicionarTooltip(e);
}
function posicionarTooltip(e) {
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  const rect = tooltip.getBoundingClientRect();
  if (x + rect.width > window.innerWidth - 10) x = e.clientX - rect.width - pad;
  if (y + rect.height > window.innerHeight - 10) y = e.clientY - rect.height - pad;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
}
function ocultarTooltip() {
  tooltip.classList.remove("show");
}

function buildMonth(year, monthIdx, porFecha, HOY) {
  const first = new Date(Date.UTC(year, monthIdx, 1));
  const startDow = mondayIndex(first.getUTCDay());
  const daysInMonth = new Date(Date.UTC(year, monthIdx+1, 0)).getUTCDate();

  const card = document.createElement("div");
  card.className = "month-card";
  const head = document.createElement("div");
  head.className = "month-head";
  head.innerHTML = `<h2>${MESES[monthIdx]} ${year}</h2><span>${daysInMonth} días</span>`;
  card.appendChild(head);

  const table = document.createElement("table");
  table.className = "cal";
  const thead = document.createElement("tr");
  DOW.forEach(d => { const th = document.createElement("th"); th.textContent = d; thead.appendChild(th); });
  table.appendChild(thead);

  let cellsUsed = startDow;
  let row = document.createElement("tr");
  for (let i = 0; i < startDow; i++) { const td = document.createElement("td"); td.className = "pad"; row.appendChild(td); }

  for (let day = 1; day <= daysInMonth; day++) {
    if (cellsUsed === 7) { table.appendChild(row); row = document.createElement("tr"); cellsUsed = 0; }
    const iso = `${year}-${String(monthIdx+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const td = document.createElement("td");
    if (iso === HOY) td.className = "today";
    const num = document.createElement("span");
    num.className = "daynum";
    num.textContent = day;
    td.appendChild(num);
    const items = porFecha[iso];
    if (items) {
      const wrap = document.createElement("div");
      wrap.className = "dot-row";
      items.forEach(t => {
        const btn = document.createElement("button");
        btn.className = "dot";
        btn.textContent = t.titulo.replace(/ — sesión.*/, "");
        btn.dataset.titulo = t.titulo;
        btn.dataset.tallerista = t.tallerista;
        btn.onclick = () => jumpTo(t.id);
        btn.addEventListener("mouseenter", (e) => mostrarTooltip(e, t));
        btn.addEventListener("mousemove", posicionarTooltip);
        btn.addEventListener("mouseleave", ocultarTooltip);
        wrap.appendChild(btn);
      });
      td.appendChild(wrap);
    }
    row.appendChild(td);
    cellsUsed++;
  }
  while (cellsUsed < 7) { const td = document.createElement("td"); td.className = "pad"; row.appendChild(td); cellsUsed++; }
  table.appendChild(row);

  card.appendChild(table);
  return card;
}

function jumpTo(id) {
  const el = document.getElementById("t-" + id);
  if (!el) return;
  el.scrollIntoView({behavior:"smooth", block:"center"});
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1600);
}
</script>
</body>
</html>
